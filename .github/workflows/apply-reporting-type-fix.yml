name: Apply reporting type fix

on:
  push:
    branches:
      - baseline/reporting-self-service-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baseline/reporting-self-service-20260909
      - name: Apply patch
        run: python .github/patch_reporting_asserts.py
      - name: Remove helpers and commit
        run: |
          git rm .github/patch_reporting_asserts.py .github/workflows/apply-reporting-type-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/hajiriflow/reporting/service.py
          git commit -m "fix: replace reporting type assertions with casts"
          git push origin HEAD:baseline/reporting-self-service-20260909
