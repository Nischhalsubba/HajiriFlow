name: V3 temporary syntax repair

on:
  push:
    branches:
      - agent/dynamic-demo-redesign-v3

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3 autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamic-demo-redesign-v3
      - name: Repair template literal and profile route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("site/assets/app-v3.js")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "All screens share `window.HFData`. A Supabase provider",
              "All screens share the window.HFData provider. A Supabase provider",
          )
          content = content.replace(
              'case "go-attendance": location.hash = "attendance"; break;',
              'case "go-attendance": location.hash = "attendance"; break;\n'
              '      case "go-settings": closeModal(); location.hash = "settings"; break;',
          )
          path.write_text(content, encoding="utf-8")
          PY
          node --check site/assets/app-v3.js
      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/app-v3.js
          git commit -m "Repair v3 frontend syntax [skip v3 autofix]"
          git push origin HEAD:agent/dynamic-demo-redesign-v3
