name: Release Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character current main SHA to release
        required: true
        type: string
      api_url:
        description: Real production HajiriFlow API origin used for preflight
        required: true
        type: string
      confirm:
        description: Confirm release of the validated current main commit
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      API_URL: ${{ inputs.api_url }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hajiriflow
          POSTGRES_PASSWORD: hajiriflow
          POSTGRES_DB: hajiriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hajiriflow -d hajiriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target SHA and production API origin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main
          test "$TARGET_SHA" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["API_URL"].strip().rstrip("/")
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("api_url must be an absolute HTTPS origin")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("api_url must not contain credentials, query, or fragment")
          if parsed.path not in ("", "/"):
              raise SystemExit("api_url must be an origin without a path")
          print(f"Validated API origin host: {parsed.hostname}")
          PY

      - name: Detect deployable changes since last production release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          last_release="$(git log -1 --grep='\[deploy\]' --format=%H || true)"
          if [ -z "$last_release" ]; then
            changed="$(git ls-tree -r --name-only HEAD)"
          else
            changed="$(git diff --name-only "$last_release"..HEAD)"
          fi
          deployable="$(printf '%s\n' "$changed" | grep -Ev '^(README(\.md)?$|CHANGELOG(\.md)?$|SECURITY\.md$|\.github/|app/docs/)' || true)"
          if [ -z "$deployable" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            printf 'Deployable changes:\n%s\n' "$deployable"
          fi

      - name: Set up Python
        if: steps.changes.outputs.deployable == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Set up Node.js
        if: steps.changes.outputs.deployable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Install validation dependencies
        if: steps.changes.outputs.deployable == 'true'
        working-directory: app
        run: |
          python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'
          python -m pip install -e '.[dev]'

      - name: Run code and browser-asset validation
        if: steps.changes.outputs.deployable == 'true'
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          for file in site/assets/*.js; do node --check "$file"; done
          pytest --cov=hajiriflow --cov-report=term-missing

      - name: Exercise PostgreSQL migration and device integrity gates
        if: steps.changes.outputs.deployable == 'true'
        working-directory: app
        shell: bash
        env:
          HAJIRIFLOW_ENVIRONMENT: test
          HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow
          HAJIRIFLOW_SESSION_SECRET: release-validation-secret-that-is-longer-than-32-characters
          HAJIRIFLOW_COOKIE_SECURE: 'false'
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current --check-heads
          pytest tests/test_postgresql_device_concurrency.py -q

      - name: Validate production runtime generation
        if: steps.changes.outputs.deployable == 'true'
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          CONTEXT=production HAJIRIFLOW_API_BASE_URL="${API_URL%/}" node scripts/generate-runtime-config.mjs
          node --check site/assets/runtime-config.js
          grep -Fq '"environment":"production"' site/assets/runtime-config.js
          grep -Fq '"operationalDataMode":"integration-required"' site/assets/runtime-config.js
          grep -Fq "/api/* ${API_URL%/}/api/:splat 200" site/_redirects
          git checkout -- site/assets/runtime-config.js site/_redirects

      - name: Preflight production API
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="${API_URL%/}"
          curl --fail --silent --show-error --max-time 20 --output health.json "$api/health"
          curl --fail --silent --show-error --max-time 20 --output ready.json "$api/ready"
          python - <<'PY'
          import json

          with open("health.json", encoding="utf-8") as handle:
              health = json.load(handle)
          with open("ready.json", encoding="utf-8") as handle:
              ready = json.load(handle)
          if health.get("status") != "ok" or health.get("environment") != "production":
              raise SystemExit("production API health preflight failed")
          if ready != {"status": "ready"}:
              raise SystemExit("production API readiness preflight failed")
          PY

      - name: Re-verify main has not moved
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$TARGET_SHA" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Authorize exactly one production deployment
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "release: production ${TARGET_SHA:0:12} [deploy]"
          git push origin HEAD:main

      - name: Record release guidance
        if: steps.changes.outputs.deployable == 'true'
        shell: bash
        run: |
          {
            echo '## HajiriFlow release authorization'
            echo
            echo "- Validated source SHA: \`$TARGET_SHA\`"
            echo '- Production API: healthy and ready before frontend authorization'
            echo '- PostgreSQL migration head: validated'
            echo '- PostgreSQL device concurrency/atomicity: validated'
            echo '- Next required step: confirm Netlify published the intended deploy and run the Production Smoke workflow'
          } >> "$GITHUB_STEP_SUMMARY"
