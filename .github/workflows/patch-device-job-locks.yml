name: Patch device job locks

on:
  push:
    branches:
      - baseline/device-platform-completion-20260908
    paths:
      - .github/workflows/patch-device-job-locks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baseline/device-platform-completion-20260908
          persist-credentials: true
      - run: python scripts/patch_device_job_locks.py
      - name: Commit permanent lock changes and remove helpers
        run: |
          git rm .github/workflows/patch-device-job-locks.yml
          git rm scripts/patch_device_job_locks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/hajiriflow/device_platform/jobs.py
          git commit -m "fix: serialize device jobs across workers"
          git push origin HEAD:baseline/device-platform-completion-20260908
