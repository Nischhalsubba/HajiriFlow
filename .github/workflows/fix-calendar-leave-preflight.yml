name: Apply calendar leave preflight fixes

on:
  push:
    branches:
      - feat/calendar-leave-foundation
    paths:
      - .github/workflows/fix-calendar-leave-preflight.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/calendar-leave-foundation
      - name: Apply targeted source fixes and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/src/hajiriflow/calendar_leave/service.py')
          text = service.read_text()
          old = 'from sqlalchemy import and_, func, or_, select\n'
          new = 'from sqlalchemy import and_, func, select\n'
          if text.count(old) != 1:
              raise SystemExit('expected one calendar service SQLAlchemy import')
          service.write_text(text.replace(old, new))

          api = Path('app/src/hajiriflow/api/calendar_leave.py')
          text = api.read_text()
          marker = 'from datetime import date\n'
          if text.count(marker) != 1:
              raise SystemExit('expected one calendar API datetime import')
          text = text.replace(marker, 'from dataclasses import asdict\nfrom datetime import date\n', 1)
          if text.count('WorkdayDecisionView(**item.__dict__)') != 1:
              raise SystemExit('expected one WorkdayDecision __dict__ conversion')
          if text.count('LeaveBalanceView(**balance.__dict__)') != 1:
              raise SystemExit('expected one LeaveBalance __dict__ conversion')
          text = text.replace(
              'WorkdayDecisionView(**item.__dict__)',
              'WorkdayDecisionView(**asdict(item))',
          )
          text = text.replace(
              'LeaveBalanceView(**balance.__dict__)',
              'LeaveBalanceView(**asdict(balance))',
          )
          api.write_text(text)
          PY
          rm .github/workflows/fix-calendar-leave-preflight.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/hajiriflow/calendar_leave/service.py app/src/hajiriflow/api/calendar_leave.py .github/workflows/fix-calendar-leave-preflight.yml
          git commit -m "fix: complete calendar leave preflight cleanup"
          git push
