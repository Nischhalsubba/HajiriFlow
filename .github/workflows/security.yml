name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hajiriflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            printf 'Tracked environment files are not allowed:\n%s\n' "$tracked_env" >&2
            exit 1
          fi
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!*.md' ':!*.txt'; then
            echo 'Private-key material detected in tracked source.' >&2
            exit 1
          fi

  dependency-and-static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Pin packaging and security tools
        run: python -m pip install 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
      - name: Install project
        run: python -m pip install -e .
      - name: Audit resolved dependencies
        run: pip-audit
      - name: Scan Python source
        run: bandit -r src -q

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
