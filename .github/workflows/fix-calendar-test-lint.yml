name: Fix calendar baseline test lint

on:
  push:
    branches:
      - baseline/calendar-leave-completion-20260908
    paths:
      - .github/workflows/fix-calendar-test-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baseline/calendar-leave-completion-20260908
          persist-credentials: true
      - name: Remove unused test assignment
        run: sed -i '352s/employee = //' app/tests/test_calendar_leave_baseline.py
      - name: Commit fix and remove this workflow
        run: |
          git rm .github/workflows/fix-calendar-test-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tests/test_calendar_leave_baseline.py
          git commit -m "test: satisfy calendar baseline lint"
          git push origin HEAD:baseline/calendar-leave-completion-20260908
