name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hajiriflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Validate frontend JavaScript
        run: |
          for file in site/assets/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: pytest --cov=hajiriflow --cov-report=term-missing
