name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install development dependencies
        run: pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Validate frontend JavaScript
        run: |
          for file in site/assets/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: pytest --cov=hajiriflow --cov-report=term-missing
