name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hajiriflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Validate frontend JavaScript
        run: |
          for file in site/assets/*.js; do
            node --check "$file"
          done

      - name: Validate production API proxy generation
        shell: bash
        run: |
          set -euo pipefail
          if CONTEXT=production HAJIRIFLOW_API_BASE_URL='' node scripts/generate-runtime-config.mjs; then
            echo 'Production config generation unexpectedly accepted a missing API upstream.' >&2
            exit 1
          fi
          CONTEXT=production HAJIRIFLOW_API_BASE_URL='https://api.example.invalid' node scripts/generate-runtime-config.mjs
          node --check site/assets/runtime-config.js
          grep -Fq '"environment":"production"' site/assets/runtime-config.js
          grep -Fq '"operationalDataMode":"integration-required"' site/assets/runtime-config.js
          grep -Fq '/api/* https://api.example.invalid/api/:splat 200' site/_redirects
          grep -Fq '/* /index.html 200' site/_redirects
          git checkout -- site/assets/runtime-config.js site/_redirects

      - name: Validate backup and service scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          grep -Fq 'I_UNDERSTAND_THIS_REPLACES_THE_TARGET' scripts/restore-postgres.ps1
          grep -Fq 'hajiriflow.device_platform.worker_cli' ops/systemd/hajiriflow-worker.service
          python -m hajiriflow.device_platform.worker_cli --help >/dev/null

      - name: Run tests
        run: pytest --cov=hajiriflow --cov-report=term-missing

  migration-roundtrip:
    name: PostgreSQL migration roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      HAJIRIFLOW_ENVIRONMENT: test
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow
      HAJIRIFLOW_SESSION_SECRET: ci-only-session-secret-that-is-longer-than-32-characters
      HAJIRIFLOW_COOKIE_SECURE: 'false'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hajiriflow
          POSTGRES_PASSWORD: hajiriflow
          POSTGRES_DB: hajiriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hajiriflow -d hajiriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install application
        run: python -m pip install -e '.[dev]'

      - name: Upgrade schema to head
        run: alembic upgrade head

      - name: Downgrade schema to base
        run: alembic downgrade base

      - name: Re-upgrade schema to head
        run: alembic upgrade head

      - name: Confirm migration head
        run: alembic current --check-heads

  backup-restore-rehearsal:
    name: PostgreSQL backup restore rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      HAJIRIFLOW_ENVIRONMENT: test
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow
      HAJIRIFLOW_SESSION_SECRET: ci-only-session-secret-that-is-longer-than-32-characters
      HAJIRIFLOW_COOKIE_SECURE: 'false'
      SOURCE_PG_URL: postgresql://hajiriflow:hajiriflow@127.0.0.1:5432/hajiriflow
      RESTORE_PG_URL: postgresql://hajiriflow:hajiriflow@127.0.0.1:5432/hajiriflow_restore
      RESTORE_SQLALCHEMY_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow_restore
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hajiriflow
          POSTGRES_PASSWORD: hajiriflow
          POSTGRES_DB: hajiriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hajiriflow -d hajiriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install application
        run: python -m pip install -e '.[dev]'

      - name: Upgrade source database and seed restore sentinel
        run: |
          alembic upgrade head
          python - <<'PY'
          import psycopg
          from hajiriflow.db.models.workforce import CompanyProfile
          from hajiriflow.db.session import get_session_factory

          session = get_session_factory()()
          session.add(CompanyProfile(
              legal_name="Backup restore sentinel Pvt. Ltd.",
              display_name="Backup restore sentinel",
              timezone="Asia/Kathmandu",
          ))
          session.commit()
          session.close()
          with psycopg.connect(
              "postgresql://hajiriflow:hajiriflow@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("DROP DATABASE IF EXISTS hajiriflow_restore")
              connection.execute("CREATE DATABASE hajiriflow_restore")
          PY

      - name: Provide PostgreSQL 17 client wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg17"
          cat > "$RUNNER_TEMP/pg17/pg_dump" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host postgres:17 pg_dump "$@"
          EOF
          cat > "$RUNNER_TEMP/pg17/pg_restore" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -i postgres:17 pg_restore "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pg17/pg_dump" "$RUNNER_TEMP/pg17/pg_restore"
          echo "$RUNNER_TEMP/pg17" >> "$GITHUB_PATH"

      - name: Backup source and restore isolated target
        shell: bash
        env:
          HAJIRIFLOW_BACKUP_DATABASE_URL: ${{ env.SOURCE_PG_URL }}
          HAJIRIFLOW_BACKUP_PATH: ${{ runner.temp }}/hajiriflow-rehearsal.dump
          HAJIRIFLOW_RESTORE_TARGET_URL: ${{ env.RESTORE_PG_URL }}
          HAJIRIFLOW_RESTORE_BACKUP_PATH: ${{ runner.temp }}/hajiriflow-rehearsal.dump
          HAJIRIFLOW_RESTORE_CONFIRM: I_UNDERSTAND_THIS_REPLACES_THE_TARGET
        run: |
          set -euo pipefail
          bash scripts/backup-postgres.sh
          bash scripts/restore-postgres.sh

      - name: Verify restored migration head and sentinel
        env:
          HAJIRIFLOW_DATABASE_URL: ${{ env.RESTORE_SQLALCHEMY_URL }}
        run: |
          alembic current --check-heads
          python - <<'PY'
          from sqlalchemy import select
          from hajiriflow.db.models.workforce import CompanyProfile
          from hajiriflow.db.session import clear_database_caches, get_session_factory

          clear_database_caches()
          session = get_session_factory()()
          item = session.scalar(
              select(CompanyProfile).where(
                  CompanyProfile.legal_name == "Backup restore sentinel Pvt. Ltd."
              )
          )
          assert item is not None
          session.close()
          PY

      - name: Prove production restore is fail-closed by default
        shell: bash
        env:
          HAJIRIFLOW_ENVIRONMENT: production
          HAJIRIFLOW_RESTORE_TARGET_URL: ${{ env.RESTORE_PG_URL }}
          HAJIRIFLOW_RESTORE_BACKUP_PATH: ${{ runner.temp }}/hajiriflow-rehearsal.dump
          HAJIRIFLOW_RESTORE_CONFIRM: I_UNDERSTAND_THIS_REPLACES_THE_TARGET
        run: |
          if bash scripts/restore-postgres.sh; then
            echo "Production restore unexpectedly bypassed the explicit override." >&2
            exit 1
          fi

  postgresql-device-integration:
    name: PostgreSQL device concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      HAJIRIFLOW_ENVIRONMENT: test
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow
      HAJIRIFLOW_SESSION_SECRET: ci-only-session-secret-that-is-longer-than-32-characters
      HAJIRIFLOW_COOKIE_SECURE: 'false'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hajiriflow
          POSTGRES_PASSWORD: hajiriflow
          POSTGRES_DB: hajiriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hajiriflow -d hajiriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Exercise advisory locks, retry atomicity, and cursor continuity
        run: pytest tests/test_postgresql_device_concurrency.py -q
