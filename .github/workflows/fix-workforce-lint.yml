name: Apply workforce lint patch

on:
  push:
    branches:
      - feat/workforce-foundation
    paths:
      - .github/workflows/fix-workforce-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/workforce-foundation
      - name: Patch required query annotation and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/hajiriflow/api/workforce.py')
          text = path.read_text()
          old = '    on_date: date = Query(),\n'
          new = '    on_date: Annotated[date, Query()],\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one required on_date Query declaration')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-workforce-lint.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/hajiriflow/api/workforce.py .github/workflows/fix-workforce-lint.yml
          git commit -m "style: fix required workforce query annotation"
          git push
