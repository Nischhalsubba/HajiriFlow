name: Identity browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/hajiriflow/api/**'
      - 'app/src/hajiriflow/core/config.py'
      - 'app/src/hajiriflow/db/**'
      - 'app/src/hajiriflow/identity/**'
      - 'app/src/hajiriflow/main.py'
      - 'app/site/**'
      - 'app/alembic/**'
      - 'app/alembic.ini'
      - 'app/pyproject.toml'
      - 'app/browser_tests/**'
      - '.github/workflows/identity-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/hajiriflow/api/**'
      - 'app/src/hajiriflow/core/config.py'
      - 'app/src/hajiriflow/db/**'
      - 'app/src/hajiriflow/identity/**'
      - 'app/src/hajiriflow/main.py'
      - 'app/site/**'
      - 'app/alembic/**'
      - 'app/alembic.ini'
      - 'app/pyproject.toml'
      - 'app/browser_tests/**'
      - '.github/workflows/identity-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hajiriflow-identity-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-browser:
    name: Real API/PostgreSQL browser authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      HAJIRIFLOW_ENVIRONMENT: test
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@localhost:5432/hajiriflow
      HAJIRIFLOW_SESSION_SECRET: ci-browser-session-secret-that-is-longer-than-32-characters
      HAJIRIFLOW_COOKIE_SECURE: 'false'
      HAJIRIFLOW_COOKIE_SAME_SITE: lax
      HAJIRIFLOW_CORS_ORIGINS: http://127.0.0.1:8765
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hajiriflow
          POSTGRES_PASSWORD: hajiriflow
          POSTGRES_DB: hajiriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hajiriflow -d hajiriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Pin packaging tools
        run: python -m pip install --upgrade 'pip==26.2.1' 'setuptools==83.0.0' 'wheel==0.47.0'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Upgrade real PostgreSQL schema
        run: alembic upgrade head

      - name: Run real browser authorization flow
        run: pytest browser_tests/test_identity_browser_e2e.py
