name: Patch BS leave period compatibility

on:
  push:
    branches:
      - baseline/calendar-leave-completion-20260908
    paths:
      - .github/workflows/patch-bs-leave-period.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baseline/calendar-leave-completion-20260908
          persist-credentials: true
      - name: Apply compatibility patch
        run: python scripts/patch_bs_leave_period.py
      - name: Commit permanent changes and remove helpers
        run: |
          git rm .github/workflows/patch-bs-leave-period.yml
          git rm scripts/patch_bs_leave_period.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/hajiriflow/calendar_leave/service.py
          git add app/tests/test_calendar_leave_api.py
          git commit -m "fix: use BS years for leave allocations"
          git push origin HEAD:baseline/calendar-leave-completion-20260908
