[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hajiriflow"
version = "0.1.0"
description = "Nepal-ready attendance, leave, reporting, and payroll platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "sqlalchemy>=2.0.43,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
hajiriflow = "hajiriflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
