<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174f42">
  <meta name="description" content="HajiriFlow workforce attendance, leave, reporting, device, and payroll workspace.">
  <title>HajiriFlow</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/styles-components.css">
  <link rel="stylesheet" href="/assets/styles-responsive.css">
  <script src="/assets/core.js" defer></script>
  <script src="/assets/views-workforce.js" defer></script>
  <script src="/assets/views-operations.js" defer></script>
  <script src="/assets/ui-core.js" defer></script>
  <script src="/assets/forms.js" defer></script>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/enhancements.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand-area">
        <a class="brand" href="#overview" aria-label="HajiriFlow overview">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span class="brand-copy">
            <strong>HajiriFlow</strong>
            <small>Workforce operations</small>
          </span>
        </a>
        <button class="icon-button sidebar-close" type="button" data-close-sidebar aria-label="Close navigation"></button>
      </div>

      <nav class="sidebar-nav" id="primary-nav"></nav>

      <div class="sidebar-footer">
        <button class="workspace-switcher" type="button" data-action="workspace-menu">
          <span class="workspace-avatar">HF</span>
          <span>
            <strong>HajiriFlow Demo</strong>
            <small>Prototype workspace</small>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="environment-status">
          <span class="status-dot is-online" aria-hidden="true"></span>
          <span>
            <strong>Frontend online</strong>
            <small>Demo data stored locally</small>
          </span>
        </div>
      </div>
    </aside>

    <button class="sidebar-backdrop" type="button" data-close-sidebar aria-label="Close navigation"></button>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button menu-button" type="button" data-open-sidebar aria-label="Open navigation"></button>
          <div class="page-heading">
            <p id="page-kicker">Workspace</p>
            <h1 id="page-title">Overview</h1>
          </div>
        </div>

        <div class="topbar-end">
          <label class="global-search" for="global-search">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="global-search" type="search" autocomplete="off" placeholder="Search this page">
            <kbd>/</kbd>
          </label>
          <div class="nepal-time" aria-live="polite">
            <span id="nepal-date">Nepal</span>
            <strong id="nepal-time">--:--</strong>
          </div>
          <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="Open notifications">
            <span class="notification-count">3</span>
          </button>
          <button class="profile-button" type="button" data-action="profile-menu" aria-label="Open profile menu">
            <span>NS</span>
          </button>
        </div>
      </header>

      <div class="demo-notice" id="demo-notice">
        <span class="demo-notice-icon" aria-hidden="true"></span>
        <p><strong>Interactive prototype:</strong> changes are saved in this browser. Backend and device connections are not active yet.</p>
        <button type="button" data-action="dismiss-demo-notice" aria-label="Dismiss notice">×</button>
      </div>

      <main class="workspace" id="workspace" tabindex="-1"></main>
    </div>
  </div>

  <div class="command-menu" id="command-menu" hidden>
    <div class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title">
      <div class="command-search-row">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="command-search" type="search" placeholder="Jump to a page or action">
        <kbd>Esc</kbd>
      </div>
      <div class="command-results" id="command-results" aria-labelledby="command-title"></div>
    </div>
  </div>

  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
