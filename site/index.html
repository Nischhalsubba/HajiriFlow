<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="HajiriFlow is a dynamic workforce attendance, leave, device, reporting, and payroll workspace.">
  <title>HajiriFlow</title>
  <link rel="icon" href="/assets/favicon.svg?v=20260803-6" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/hajiriflow-v3.css?v=20260803-6">
  <link rel="stylesheet" href="/assets/hajiriflow-v4.css?v=20260803-6">
  <link rel="stylesheet" href="/assets/experience-v5.css?v=20260803-6">
  <script src="/assets/demo-engine.js?v=20260803-6" defer></script>
  <script src="/assets/loading-v5.js?v=20260803-6" defer></script>
  <script src="/assets/app-v3.js?v=20260803-6" defer></script>
  <script src="/assets/shell-v4.js?v=20260803-6" defer></script>
  <script src="/assets/media-v5.js?v=20260803-6" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.42.1/dist/motion.js" defer></script>
  <script src="/assets/motion-v5.js?v=20260803-6" defer></script>
</head>
<body class="app-is-loading">
  <a class="skip-link" href="#workspace">Skip to workspace</a>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand-block">
        <a class="brand" href="#overview" aria-label="HajiriFlow overview">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 28 28"><path d="M6 5v18M22 5v18M6 14h16"/></svg>
          </span>
          <span class="brand-wordmark">
            <strong>HajiriFlow</strong>
            <small>Workforce intelligence</small>
          </span>
        </a>
        <button class="icon-button sidebar-close" type="button" data-close-sidebar aria-label="Close navigation">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="workspace-card" id="workspace-card" aria-live="polite"></div>
      <nav class="sidebar-nav" id="primary-nav"></nav>

      <div class="sidebar-footer">
        <div class="connection-card" id="connection-card"></div>
        <button class="user-card" type="button" data-action="profile-menu" aria-label="Open profile menu">
          <span class="user-avatar">NS</span>
          <span class="user-copy">
            <strong>Nischhal Subba</strong>
            <small>Workspace administrator</small>
          </span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
      </div>
    </aside>

    <button class="sidebar-backdrop" type="button" data-close-sidebar aria-label="Close navigation"></button>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button menu-button" type="button" data-open-sidebar aria-label="Collapse navigation" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="page-heading">
            <div class="breadcrumb" id="page-kicker">Workspace</div>
            <h1 id="page-title">Overview</h1>
          </div>
        </div>

        <div class="topbar-right">
          <button class="search-trigger" type="button" data-action="open-command-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span>Search or jump to…</span>
            <kbd>⌘K</kbd>
          </button>
          <div class="live-clock" aria-live="polite">
            <span id="nepal-date">Nepal</span>
            <strong id="nepal-time">--:--</strong>
          </div>
          <button class="icon-button" type="button" data-action="notifications" aria-label="Open notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h2"/></svg>
            <span class="notification-badge" id="notification-count">0</span>
          </button>
          <button class="avatar-button" type="button" data-action="profile-menu" aria-label="Open profile menu">NS</button>
        </div>
      </header>

      <div class="app-skeleton" id="app-skeleton" aria-hidden="true" data-loading-kind="initial">
        <section class="skeleton-heading">
          <span class="skeleton-line is-eyebrow"></span>
          <span class="skeleton-line is-title"></span>
          <span class="skeleton-line is-copy"></span>
        </section>
        <section class="skeleton-metrics">
          <article class="skeleton-metric"><span class="skeleton-circle"></span><span class="skeleton-copy"><span class="skeleton-line is-short"></span><span class="skeleton-line"></span></span></article>
          <article class="skeleton-metric"><span class="skeleton-circle"></span><span class="skeleton-copy"><span class="skeleton-line is-short"></span><span class="skeleton-line"></span></span></article>
          <article class="skeleton-metric"><span class="skeleton-circle"></span><span class="skeleton-copy"><span class="skeleton-line is-short"></span><span class="skeleton-line"></span></span></article>
          <article class="skeleton-metric"><span class="skeleton-circle"></span><span class="skeleton-copy"><span class="skeleton-line is-short"></span><span class="skeleton-line"></span></span></article>
        </section>
        <section class="skeleton-grid">
          <article class="skeleton-panel is-tall"><span class="skeleton-line is-short"></span><span class="skeleton-block"></span></article>
          <article class="skeleton-panel"><span class="skeleton-line is-short"></span><span class="skeleton-line"></span><span class="skeleton-line"></span><span class="skeleton-line"></span><span class="skeleton-line is-short"></span></article>
        </section>
      </div>

      <main class="workspace" id="workspace" tabindex="-1" aria-live="polite" aria-busy="true"></main>
    </div>
  </div>

  <div class="command-layer" id="command-layer" hidden>
    <div class="command-panel" role="dialog" aria-modal="true" aria-labelledby="command-title">
      <div class="command-input-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="command-input" type="search" autocomplete="off" placeholder="Search employees, pages, or actions">
        <kbd>Esc</kbd>
      </div>
      <div class="command-results" id="command-results"></div>
    </div>
  </div>

  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
