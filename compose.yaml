services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hajiriflow
      POSTGRES_USER: hajiriflow
      POSTGRES_PASSWORD: hajiriflow
    ports:
      - "5432:5432"
    volumes:
      - hajiriflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajiriflow -d hajiriflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@db:5432/hajiriflow
      HAJIRIFLOW_SESSION_SECRET: local-compose-secret-that-is-longer-than-thirty-two-characters
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env
    environment:
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@db:5432/hajiriflow
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "hajiriflow.worker"]
    env_file: .env
    environment:
      HAJIRIFLOW_DATABASE_URL: postgresql+psycopg://hajiriflow:hajiriflow@db:5432/hajiriflow
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  hajiriflow_postgres:
